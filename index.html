<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chromachron</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#646464">
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chromachron">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icon_32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icon_16.png">

  <!-- Apple Touch Icons (iOS PWA Home Screen) -->
  <link rel="apple-touch-icon" sizes="57x57"   href="icon_57.png">
  <link rel="apple-touch-icon" sizes="60x60"   href="icon_60.png">
  <link rel="apple-touch-icon" sizes="72x72"   href="icon_72.png">
  <link rel="apple-touch-icon" sizes="76x76"   href="icon_76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="icon_114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icon_120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="icon_144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon_152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon_180.png">

  <link rel="stylesheet" type="text/css" href="style.css?v=2">
</head>
<body>
  <main></main>

  <script src="https://cdn.jsdelivr.net/npm/p5@2.2.2/lib/p5.js"></script>
  <script src="chromachronv.js?v=2"></script>
  <script>
    // iOS PWA: Scrollen und Bounce-Effekt unterbinden
    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
